<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dislexion</title>
<meta name="description" content="Name something in the category. The fewer people who'd say it, the more points. Spelling doesn't have to be right.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1220; --card:#181c2e; --card2:#20253b; --ink:#f2f1ec; --soft:#9aa0b8; --line:#2b3150;
  --accent:#ffcf3f; --accentInk:#1a1400; --bad:#ff5d6c;
  --c1:#8b93ad; --c2:#3ddc97; --c3:#4ea8ff; --c4:#b06cff; --c5:#ffb020;
}
:root[data-theme="light"]{--bg:#f4f1e8;--card:#fffdf7;--card2:#f1ece0;--ink:#1b1d26;--soft:#6b6f80;--line:#e2dccd;--accent:#ffb800;--c1:#8b93ad}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:10px;height:44px;margin-bottom:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.01em;background:none;border:0;padding:0}
.logo span{color:var(--accent)}
.spacer{flex:1}
.ghost{background:none;border:0;color:var(--soft);padding:8px;border-radius:10px}
.ghost:hover{color:var(--ink)}
.ghost svg{width:22px;height:22px;display:block}
.screen{display:none}.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* start */
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font-size:44px;line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--soft);margin:0 auto;max-width:420px;line-height:1.5}
.play{display:grid;gap:12px;margin:26px 0 14px}
.bigbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:20px;padding:20px 22px;font-size:22px;font-weight:600;text-align:left}
.bigbtn small{display:block;font-size:14px;font-weight:400;opacity:.75;margin-top:2px}
.bigbtn.daily{background:var(--accent);color:var(--accentInk)}
.bigbtn.endless{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.bigbtn .go{font-size:28px}
.statline{display:flex;justify-content:center;gap:22px;color:var(--soft);font-size:14px;margin-top:10px;flex-wrap:wrap}
.statline b{color:var(--ink);font-weight:600}

/* round */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.now{outline:2px solid var(--ink);outline-offset:2px}
.score{margin-left:auto;font-size:15px;color:var(--soft)}
.score b{font-size:22px;color:var(--ink);font-weight:800;margin-left:6px}
.streak{font-size:13px;font-weight:600;color:var(--accentInk);background:var(--accent);border-radius:99px;padding:3px 10px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 20px 20px;position:relative;overflow:hidden}
.qrow{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring.low .fg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}
.prompt{font-size:32px;font-weight:800;line-height:1.12;letter-spacing:-.01em;margin-top:2px}
.say{background:none;border:0;color:var(--soft);font-size:14px;padding:4px 0;text-decoration:underline}
.inrow{display:flex;gap:10px;margin-top:20px}
.inrow input{flex:1;min-width:0;font-size:26px;font-weight:600;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);outline:none}
.inrow input:focus{border-color:var(--accent)}
.inrow input:disabled{opacity:.6}
.mic{width:60px;flex:none;border:2px solid var(--line);background:var(--bg);border-radius:16px;display:grid;place-items:center}
.mic svg{width:26px;height:26px}
.mic.on{border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,93,108,.18)}}
.hint{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--soft);min-height:24px}
.kbd{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

/* reveal */
.reveal{margin-top:18px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:16px}
.pts{font-size:64px;font-weight:800;line-height:1;min-width:96px;font-variant-numeric:tabular-nums}
.vt{flex:1;min-width:0}
.vt .name{font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;color:#0d0f18;margin-top:6px}
.pct{font-size:14px;color:var(--soft);margin-top:4px}
.fix{font-size:14px;color:var(--soft);margin-top:4px}
.board{margin-top:16px;display:grid;gap:6px}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:var(--card2);font-size:15px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--line);z-index:0}
.bar span{position:relative;z-index:1}
.bar.you{outline:2px solid var(--accent)}
.bar.you i{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.rare{font-size:14px;color:var(--soft);margin-top:12px;line-height:1.6}
.rare b{color:var(--ink);font-weight:600}
.nextrow{display:flex;align-items:center;gap:12px;margin-top:18px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:600;background:var(--accent);color:var(--accentInk)}
.btn.alt{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.checking{display:flex;align-items:center;gap:10px;color:var(--soft);margin-top:18px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* summary */
.sum{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px}
.sum .big{font-size:72px;font-weight:800;line-height:1;margin:6px 0}
.rows{margin:16px 0;display:grid;gap:8px}
.rowi{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card2);border-radius:12px}
.rowi .sw{width:10px;align-self:stretch;border-radius:6px;flex:none}
.rowi .t{flex:1;min-width:0;font-size:15px}
.rowi .t small{display:block;color:var(--soft)}
.rowi .p{font-weight:800;font-size:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:22px;width:min(440px,calc(100% - 24px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 14px;font-size:20px}
.opt{margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600}
@media (max-width:520px){ .hero h1{font-size:36px} .prompt{font-size:26px} .pts{font-size:52px;min-width:76px} .ring,.ring svg{width:56px;height:56px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <button class="logo" id="home">Dislexi<span>on</span></button>
    <div class="spacer"></div>
    <button class="ghost" id="sound" aria-label="Sound on/off"></button>
    <button class="ghost" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <section class="screen on" id="sStart">
    <div class="hero">
      <h1>Say the thing<br>nobody says.</h1>
      <p>Name something in the category. The fewer people who'd say it, the more points. Spell it however — we'll know what you meant.</p>
    </div>
    <div class="play">
      <button class="bigbtn daily" id="goDaily"><span>Daily<small id="dailySub">7 categories · same for everyone</small></span><span class="go">→</span></button>
      <button class="bigbtn endless" id="goEndless"><span>Endless<small>Keep going as long as you want</small></span><span class="go">→</span></button>
    </div>
    <div class="statline" id="statline"></div>
  </section>

  <section class="screen" id="sRound">
    <div class="top">
      <div class="dots" id="dots"></div>
      <span class="streak" id="streak" hidden></span>
      <div class="score">Score<b id="score">0</b></div>
    </div>
    <div class="stage" id="stage">
      <div class="qrow">
        <div class="ring" id="ring"><svg viewBox="0 0 64 64"><circle class="bgc" cx="32" cy="32" r="28"/><circle class="fg" id="ringFg" cx="32" cy="32" r="28"/></svg><b id="ringN"></b></div>
        <div style="min-width:0">
          <div class="label" id="label"></div>
          <div class="prompt" id="prompt"></div>
          <button class="say" id="sayPrompt">Read it to me</button>
        </div>
      </div>
      <form class="inrow" id="form" autocomplete="off">
        <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type or tap the mic" aria-label="Your answer" enterkeyhint="go">
        <button type="button" class="mic" id="mic" aria-label="Say your answer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button>
      </form>
      <div class="hint" id="hint"><span id="heard"><span class="kbd">Enter</span> to lock it in</span><button class="say" id="skip">Skip</button></div>
      <div id="reveal"></div>
    </div>
  </section>

  <section class="screen" id="sDone"><div class="sum" id="sum"></div></section>
</div>

<dialog id="dlg">
  <h2>Settings</h2>
  <div class="opt"><div class="label">Timer</div><div class="chips" id="optTimer"></div></div>
  <div class="opt"><div class="label">Extra categories in Endless</div><div class="chips" id="optPacks"></div></div>
  <div class="opt"><div class="label">Look</div><div class="chips" id="optTheme"></div></div>
  <div style="text-align:right"><button class="btn" id="dlgClose">Done</button></div>
</dialog>

<script>
/* ===== Brilliant engine: spelling guesser + word prediction (no DOM) ===== */
const Engine = (() => {
  // ---- dyslexia-typical misspellings -> fix (always win) ----
  const MISS = {};
  (`because:becuz,becuse,becase,becouse,beacuse,becuase,becaus,becoz,becos,cuz,cauz,bc,bcuz,becauze|what:wat,wut,whut|when:wen,whn|where:wher,whare,were'|which:wich,whitch,wihch|would:woud,wuld,wud,wold|could:cud,coud,culd|should:shud,shoud,shuld|they:thay,tey|there:ther,thare|their:thier,theyr|said:sed,sayed|says:sez|enough:enuff,enuf,enugh,enogh,enouf,inuf|friend:freind,frend,frened|friends:frends,freinds|people:peple,poeple,pepole,pepul,peepul,peeple|tomorrow:tomoro,tomorow,tommorow,tommorrow,tomorro,tmrw,tmr|tonight:tonite,2nite|night:nite|through:thru,threw',thrugh|though:tho|tough:tuff|a lot:alot|definitely:definately,defenitly,definatly,defintely,definetly,defanetly|probably:probly,probaly,prolly,probabaly|really:realy,relly,rlly|actually:acually,actualy,akshully,acshully|business:bisness,buisness,busness,biznis|Wednesday:wensday,wednsday,wendsday|February:febuary,febuary|library:libary,liberry|again:agian,agen,agin|against:aginst,agenst|always:allways,alwas,allwas|answer:anser,awnser,ansur|before:befor,befour,befur|beginning:begining,beggining|believe:beleive,belive,beleve|breakfast:brekfast,breckfast|called:caled,cald|chief:cheif|chocolate:choclate,chocolat|coming:comming,cumming|different:diffrent,difrent,differnt,difernt|doesn't:dosent,doesnt,dosnt|don't:dont|didn't:didnt|can't:cant|won't:wont|isn't:isnt|wasn't:wasnt|I'm:im|I've:ive|you're:youre|that's:thats|what's:whats|it's:its'|any:eny|every:evry,evrey|everyone:evryone,everone,evrywun|everything:evrything,everthing,evrythin|family:famly,familiy,famaly|finally:finaly,finnaly|first:frist,ferst|government:goverment,govrment|guess:gess,ges|grammar:grammer|happened:happend,hapened|have:hav,hafe|house:hous,howse|interesting:intresting,intersting,intristing|interest:intrest,intrist|interests:intrests,intristes,intrestes,intrists|interested:intrested,intristed|just:jus,jst|knowledge:knowlege,nolege,nowlege|laugh:laff,lauf|learn:lern,lurn|listen:lisen,lissen,lisin|little:litle,littel|maybe:mabey,mayby,maybee,mabye|minute:minit|misspell:mispell,misspel|need:nead,neeed|necessary:neccesary,necesary,nessesary,nesesary|nothing:nothin,nuthing|occasion:ocasion,occassion|occurred:occured|often:ofen,offen|piece:peice|please:pleez,plez,pls,plz,pleas|possible:possable,posible|pretty:preety,prety,purty|receive:recieve,receve|right:rite|school:scool,skool,schol|separate:seperate,seprate|sure:shure,shur|something:sumthing,somthing,sumthin|someone:sumone,somone,sumwun|stories:storys|surprise:suprise,surprize|teacher:techer,teecher|thanks:thanx,thnks,thx|thought:thot,thougt|time:tyme|together:togather,togehter,togeather|tongue:tounge|trouble:trubble,truble|truly:truely,truley|until:untill,untile|usually:usally,usualy,ushually|wait:wayt|weird:wierd|while:wile|written:writen|writing:wrighting,writting,writeing|yesterday:yesturday,yestarday,yesterdy|your:yor,ur|you:u,yu|about:abowt,abut,abaut|anything:enything,anythin|certain:sertain,curtain'|schedule:skedule,schedual,shedule|another:anouther,anuther|brilliant:brillant,briliant,brilent|dyslexia:dyslexa,dislexia,dyslexsia,dislexya|speech:speach|whether:wether|recommend:reccomend,recomend,reccommend|address:adress|argument:arguement|calendar:calender|colleague:collegue|embarrass:embarass|environment:enviroment,envirnment|existence:existance|foreign:foriegn|forty:fourty|guard:gaurd|happiness:happyness|independent:independant|jewelry:jewelery|pursue:persue|possession:posession|publicly:publically|questionnaire:questionaire|referred:refered|rhythm:rythm,rythem|similar:similiar,simular|sincerely:sincerly,sinserely|successful:succesful,sucessful,successfull|achieve:acheive,acheeve|across:accross,acrost|beginner:begginer,beginer|battery:batery,battary,battry|batteries:batterys,bateries|solder:sodder,sauder,soder|processor:prosessor,procesor|computer:compueter,computor,compter|software:sofware,softwear|hardware:harware,hardwear|electronics:elecronics,electonics,elektronics|engineer:ingeneer,enginer,engeneer|investor:invester|investors:investers|beautiful:beutiful,butiful,beautifull,bueatiful|because of:becuzof|was:wuz,woz,wos|of:ov|the:teh,hte,th|and:adn,nad|that:taht,tht|with:wiht,whit'|have to:hafta|going to:gonna'|want to:wanna'|question:kwestion,qestion,questin|explain:eksplain,explane|square:skwer,sqare|phone:fone|elephant:elefant|dinosaur:dinosor,dinasaur|circle:sircle,cirkle|laughter:lafter|special:speshul,specal|picture:pikture,pitcher'|probably:prolly|whatever:watever,whatevr|favorite:favrite,faverite,favorit|animal:aminal|remember:rember,remeber|exactly:exacly,ezactly|especially:espesially,expecially,especialy`).split('|').forEach(row => {
    const [fix, list] = row.split(':');
    list.split(',').forEach(t => { if (!t.endsWith("'")) MISS[t] = fix; });
  });

  // ---- homophones / easily-mixed words, with plain-English hints ----
  const CONFUSE = {};
  (`there=a place;their=belongs to them;they're=they are|your=belongs to you;you're=you are|to=toward;too=also / very;two=the number 2|its=belongs to it;it's=it is|then=next, after that;than=comparing (bigger than)|where=what place;were=past of are;wear=put on clothes;we're=we are|no=opposite of yes;know=understand|new=not old;knew=past of know|right=correct / a side;write=put words down|hear=with your ears;here=this place|weather=rain, sun, snow;whether=if|form=a paper / a shape;from=where it started|quite=very;quiet=no noise|lose=not win / can't find;loose=not tight|affect=to change something;effect=the result|accept=say yes to;except=but not|buy=pay for;by=next to / made by;bye=goodbye|our=belongs to us;are=is (for many);hour=60 minutes|of=part of;off=not on|which=what one;witch=a magic person|whole=all of it;hole=a gap|peace=calm, no fighting;piece=a part of something|brake=to stop;break=smash / a rest|weak=not strong;week=7 days|meat=food;meet=get together|sea=the ocean;see=with your eyes|one=the number 1;won=past of win|for=for you;four=the number 4|threw=tossed;through=in one side, out the other|allowed=permitted;aloud=out loud|board=a flat piece / a group;bored=not interested|desert=sandy dry place;dessert=sweet food|passed=went by;past=time before now|principal=school boss / main;principle=a rule or belief|sell=give for money;cell=tiny unit / phone|plane=airplane;plain=simple|waist=middle of body;waste=throw away|tale=a story;tail=back end of an animal|mail=letters;male=a boy or man|sale=selling cheap;sail=on a boat|steal=take without asking;steel=strong metal|wait=stay;weight=how heavy|wood=from trees;would=might do|flour=for baking;flower=a plant|lead=to guide / a metal;led=past of lead / LED light|wright=a maker;right=correct`).split('|').forEach(g => {
    const items = g.split(';').map(x => { const [w, h] = x.split('='); return { w, h }; });
    items.forEach(it => { CONFUSE[it.w] = items; });
  });

  // ---- seed next-word pairs (prev:next,next) ----
  const SEED = {};
  function addPairs(str, bucket, weight) {
    str.split('|').forEach(row => {
      const [p, list] = row.split(':'); if (!list) return;
      const arr = bucket[p] || (bucket[p] = []);
      list.split(',').forEach((n, i) => arr.push({ w: n, v: weight - i * 0.06 }));
    });
  }

  if (G.mode === 'daily' && G.i >= G.deck.length - 1) return finish();
  if (G.mode === 'endless' && G.i >= G.deck.length - 1) {
    let d = shuffle(CATS.filter(c => c.p === 'general' || S.packs.includes(c.p)));
    if (G.cur && d[0] === G.cur) d.push(d.shift());
    G.deck = G.deck.concat(d);
  }
  G.i++; G.cur = G.deck[G.i]; G.done = false;
  $('label').textContent = G.mode === 'daily' ? `Daily · ${G.i + 1} of 7` : `Endless · round ${G.i + 1}`;
  $('prompt').textContent = ptext(G.cur.q);
  $('reveal').innerHTML = ''; $('hint').hidden = false;
  $('heard').innerHTML = '<span class="kbd">Enter</span> to lock it in';
  const inp = $('inp'); inp.value = ''; inp.disabled = false; inp.focus();
  renderTop(); startTimer();
}
function renderTop() {
  $('score').textContent = G.total;
  const d = $('dots');
  if (G.mode === 'daily') d.innerHTML = G.deck.map((_, k) => { const l = G.log[k]; return `<i class="${k === G.i && !G.done ? 'now' : ''}" style="${l ? 'background:' + (l.pts ? tier(l.base)[2] : 'var(--bad)') : ''}"></i>`; }).join('');
  else d.innerHTML = '';
  const st = $('streak'); st.hidden = G.mode !== 'endless' || G.streak < 2; st.textContent = `Streak ${G.streak}`;
}
function startTimer() {
  clearInterval(timer); const ring = $('ring');
  if (!S.timer) { ring.hidden = true; return; }
  ring.hidden = false; endsAt = Date.now() + S.timer * 1000; lastSec = S.timer + 1;
  const tick = () => {
    const left = Math.max(0, endsAt - Date.now()), sec = Math.ceil(left / 1000);
    $('ringFg').style.strokeDashoffset = C * (1 - left / (S.timer * 1000));
    $('ringN').textContent = sec; ring.classList.toggle('low', left < 5000);
    if (sec !== lastSec) { if (sec <= 3 && sec > 0) sfx.tick(); lastSec = sec; }
    if (left <= 0) { clearInterval(timer); lock($('inp').value, 'time'); }
  };
  tick(); timer = setInterval(tick, 100);
}

async function lock(raw, how) {
  if (G.done) return;
  G.done = true; clearInterval(timer); stopMic();
  const said = (raw || '').trim(), cat = G.cur;
  $('inp').disabled = true; $('hint').hidden = true;
  let m = said ? match(cat, said) : null, ai = false;
  if (!m && said) {
    $('reveal').innerHTML = `<div class="checking"><div class="spin"></div>Not on our list — checking “${esc(said)}”…</div>`;
    const r = await aiCheck(cat.q, said);
    if (r && r.valid) {
      ai = true; m = { e: [[r.name], ptsFor(r.percent), r.percent], f: r.name, cost: 0 };
      (learned[cat.q] = learned[cat.q] || {})[squash(norm(said))] = [r.name, r.percent];
      learned[cat.q][squash(norm(r.name))] = [r.name, r.percent]; store.set('learned', learned);
    } else if (!r) m = null, G.offline = true;
  }
  const base = m ? m.e[1] : 0;
  let bonus = 0;
  if (base) { G.streak++; if (G.mode === 'endless' && G.streak > 1) bonus = Math.min(20, (G.streak - 1) * 2); } else G.streak = 0;
  const pts = base + bonus;
  G.total += pts;
  G.log.push({ q: cat.q, said, ans: m ? m.e[0][0] : null, pts, base, pct: m ? m.e[2] : 0 });
  stats.rounds++; stats.points += pts; stats.bestStreak = Math.max(stats.bestStreak, G.streak);
  if (m && (!stats.best || base > stats.best.pts)) stats.best = { q: cat.q, ans: m.e[0][0], pts: base };
  saveStats();
  reveal(cat, said, m, how, base, bonus, ai);
  renderTop();
}

function reveal(cat, said, m, how, base, bonus, ai) {
  const top = cat.a.slice(0, 5);
  const maxPct = Math.max(...top.map(a => a[2]), m ? m.e[2] : 0) || 1;
  const inTop = m && top.includes(m.e);
  let h = '<div class="reveal">';
  if (m) {
    const [, label, color] = tier(base);
    const typo = norm(said) !== norm(m.f) && squash(norm(said)) !== squash(norm(m.f)) && !ai;
    h += `<div class="verdict"><div class="pts" id="ptsN" style="color:${color}">0</div><div class="vt"><div class="name">${esc(title(m.e[0][0]))}</div>
      <span class="badge" style="background:${color}">${label}</span>${bonus ? ` <span class="badge" style="background:var(--accent)">+${bonus} streak</span>` : ''}
      <div class="pct">${fmtPct(m.e[2])} of people say this${ai ? ' · checked by AI' : ''}</div>
      ${typo ? `<div class="fix">You typed “${esc(said)}” — counted.</div>` : ''}</div></div>`;
  } else {
    const msg = how === 'skip' ? 'Skipped' : how === 'time' && !said ? "Time's up" : G.offline && said ? `Couldn't check “${esc(said)}”` : `“${esc(said)}” doesn't fit`;
    h += `<div class="verdict"><div class="pts" style="color:var(--bad)">0</div><div class="vt"><div class="name">${msg}</div>${G.offline && said ? '<div class="pct">The answer checker is offline. <button class="say" id="countIt">Count it anyway (25)</button></div>' : ''}</div></div>`;
  }
  h += '<div class="board">' + top.map(a => `<div class="bar${m && a === m.e ? ' you' : ''}"><i style="width:${(a[2] / maxPct) * 100}%"></i><span>${esc(title(a[0][0]))}</span><span>${fmtPct(a[2])}</span></div>`).join('');
  if (m && !inTop) h += `<div class="bar you"><i style="width:${Math.max(2, (m.e[2] / maxPct) * 100)}%"></i><span>You: ${esc(title(m.e[0][0]))}</span><span>${fmtPct(m.e[2])}</span></div>`;
  h += '</div>';
  const rare = cat.a.slice(-3).reverse().map(a => `<b>${esc(title(a[0][0]))}</b>`).join(', ');
  h += `<div class="rare">Deep cuts: ${rare}</div>`;
  const last = G.mode === 'daily' && G.i >= G.deck.length - 1;
  h += `<div class="nextrow"><button class="btn" id="nextBtn">${last ? 'See results' : 'Next'}</button><span class="label" style="text-transform:none;letter-spacing:0">or press Enter</span></div></div>`;
  $('reveal').innerHTML = h;
  $('nextBtn').onclick = next;
  setTimeout(() => $('nextBtn') && $('nextBtn').focus(), 50);
  const ci = $('countIt');
  if (ci) ci.onclick = () => { const l = G.log[G.log.length - 1]; l.ans = said; l.pts = l.base = 25; G.total += 25; G.streak++; renderTop(); reveal(cat, said, { e: [[said], 25, 0.5], f: said, cost: 0 }, 'custom', 25, 0, false); };
  if (m) {
    sfx.hit(base);
    const el = $('ptsN'), total = base + bonus, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 600); el.textContent = Math.round(total * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    if (base >= 72) burst(tier(base)[2].includes('c5') ? '#ffb020' : '#b06cff', base >= 92 ? 140 : 70);
  } else { sfx.miss(); $('stage').classList.remove('shake'); void $('stage').offsetWidth; $('stage').classList.add('shake'); }
}

function finish() {
  clearInterval(timer); stopMic();
  const n = G.log.length, avg = n ? Math.round(G.total / n) : 0;
  if (G.mode === 'daily') stats.daily[today()] = { total: G.total, log: G.log };
  else if (n >= 5 && avg > stats.endlessBest) stats.endlessBest = avg;
  saveStats();
  const sq = l => !l.pts ? '⬛' : l.base >= 92 ? '🟧' : l.base >= 72 ? '🟪' : l.base >= 48 ? '🟦' : l.base >= 25 ? '🟩' : '⬜';
  const share = G.mode === 'daily' ? `Dislexion ${today()} — ${G.total}/700\n${G.log.map(sq).join('')}\ndislexion.vortex1.dev`
    : `Dislexion Endless — ${G.total} pts in ${n} rounds\n${G.log.slice(-20).map(sq).join('')}\ndislexion.vortex1.dev`;
  let h = `<div class="label">${G.mode === 'daily' ? 'Daily · ' + today() : 'Endless run'}</div><div class="big">${G.total}</div>
    <div style="color:var(--soft)">${G.mode === 'daily' ? 'out of 700' : `${n} rounds · ${avg} per answer`}</div><div class="rows">`;
  h += G.log.map(l => `<div class="rowi"><div class="sw" style="background:${l.pts ? tier(l.base)[2] : 'var(--bad)'}"></div><div class="t">${esc(ptext(l.q))}<small>${l.ans ? esc(title(l.ans)) + ' · ' + fmtPct(l.pct) : l.said ? '“' + esc(l.said) + '” — no' : 'no answer'}</small></div><div class="p">${l.pts}</div></div>`).join('');
  h += `</div><div class="actions"><button class="btn" id="again">${G.mode === 'daily' ? 'Play Endless' : 'Go again'}</button><button class="btn alt" id="copy">Share</button><button class="btn alt" id="menu">Menu</button></div>`;
  $('sum').innerHTML = h; show('sDone');
  $('again').onclick = () => start('endless'); $('menu').onclick = home;
  $('copy').onclick = async () => { try { if (navigator.share && matchMedia('(pointer:coarse)').matches) await navigator.share({ text: share }); else { await navigator.clipboard.writeText(share); $('copy').textContent = 'Copied'; } } catch {} };
  if (G.mode === 'daily' && G.total >= 350) burst('#ffcf3f', 160);
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startMic() {
  if (!SR) { $('heard').textContent = 'Voice needs Chrome, Edge or Safari.'; return; }
  if (!G || G.done) return;
  stopMic();
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.maxAlternatives = 6;
  $('mic').classList.add('on'); $('heard').textContent = 'Listening…';
  rec.onresult = ev => {
    const r = ev.results[ev.results.length - 1];
    $('inp').value = r[0].transcript.trim();
    if (!r.isFinal) return;
    let best = null, text = r[0].transcript;
    for (let i = 0; i < r.length; i++) { const m = match(G.cur, r[i].transcript); if (m && (!best || m.cost < best.cost || (m.cost === best.cost && m.e[2] < best.e[2]))) { best = m; text = r[i].transcript; } }
    $('inp').value = text.trim(); lock(text, 'voice');
  };
  rec.onerror = ev => { $('heard').textContent = ev.error === 'not-allowed' ? 'Microphone blocked — allow it in the address bar.' : ev.error === 'no-speech' ? "Didn't hear anything. Tap the mic again." : ''; };
  rec.onend = () => { $('mic').classList.remove('on'); rec = null; };
  try { rec.start(); } catch {}
}
function stopMic() { if (rec) { try { rec.abort(); } catch {} rec = null; } $('mic').classList.remove('on'); }
function speak(t) { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = .95; speechSynthesis.speak(u); }

/* ---------- screens & settings ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); scrollTo(0, 0); }
function home() {
  clearInterval(timer); stopMic();
  if (G && G.mode === 'endless' && G.log.length && $('sRound').classList.contains('on')) return finish();
  G = null; renderStart(); show('sStart');
}
function renderStart() {
  const d = stats.daily[today()];
  $('dailySub').textContent = d ? `Done today · ${d.total} pts · play again for fun` : '7 categories · same for everyone';
  const bits = [];
  if (stats.rounds) bits.push(`<span>Avg <b>${Math.round(stats.points / stats.rounds)}</b></span>`);
  if (stats.bestStreak > 1) bits.push(`<span>Best streak <b>${stats.bestStreak}</b></span>`);
  if (stats.best) bits.push(`<span>Best <b>${esc(title(stats.best.ans))}</b> (${stats.best.pts})</span>`);
  $('statline').innerHTML = bits.join('');
}
function chips(el, items, isOn, onTap) {
  el.innerHTML = ''; items.forEach(([v, l]) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = l; b.setAttribute('aria-pressed', isOn(v)); b.onclick = () => { onTap(v); saveS(); renderSettings(); }; el.appendChild(b); });
}
function renderSettings() {
  chips($('optTimer'), [[20, '20s'], [30, '30s'], [45, '45s'], [0, 'Off']], v => S.timer === v, v => S.timer = v);
  chips($('optPacks'), Object.entries(PACKS), v => S.packs.includes(v), v => S.packs = S.packs.includes(v) ? S.packs.filter(x => x !== v) : [...S.packs, v]);
  chips($('optTheme'), [['dark', 'Dark'], ['light', 'Light']], v => S.theme === v, v => { S.theme = v; applyTheme(); });
}
function applyTheme() { document.documentElement.dataset.theme = S.theme; }

$('goDaily').onclick = () => start('daily');
$('goEndless').onclick = () => start('endless');
$('home').onclick = home;
$('form').onsubmit = e => { e.preventDefault(); if ($('inp').value.trim()) lock($('inp').value, 'type'); else { $('stage').classList.remove('shake'); void $('stage').offsetWidth; $('stage').classList.add('shake'); } };
$('skip').onclick = () => lock('', 'skip');
$('mic').onclick = () => rec ? stopMic() : startMic();
$('sayPrompt').onclick = () => G && speak(ptext(G.cur.q));
$('gear').onclick = () => { renderSettings(); $('dlg').showModal(); };
$('dlgClose').onclick = () => $('dlg').close();
$('sound').onclick = () => { S.sound = !S.sound; saveS(); renderSound(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && G && G.done && $('sRound').classList.contains('on') && $('nextBtn') && document.activeElement !== $('countIt')) { e.preventDefault(); next(); }
});
$('reveal').addEventListener('click', e => { if (e.target.closest('button')) return; if (G && G.done && $('nextBtn')) next(); });
applyTheme(); renderSound(); renderStart();
})();
</script>
</body>
</html>
