<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dislexion</title>
<meta name="description" content="Name something in the category. The less common your answer, the more points you get. Spelling doesn't have to be perfect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#1d1f23; --soft:#6a6f78; --line:#e3dccd; --accent:#2f5bea; --accentInk:#fff;
  --good:#1f9d55; --bad:#d64545; --bar:#ece6d8;
  --r1:#9aa3ad; --r2:#2f9e6b; --r3:#2f6fea; --r4:#8a3ffc; --r5:#e08a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121418;--card:#1b1e24;--ink:#ecebe6;--soft:#9ca2ab;--line:#2c3038;--bar:#2a2e36;--accent:#6d8cff}
}
:root[data-theme="dark"]{--bg:#121418;--card:#1b1e24;--ink:#ecebe6;--soft:#9ca2ab;--line:#2c3038;--bar:#2a2e36;--accent:#6d8cff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:22px;letter-spacing:.01em;background:none;border:0;padding:0}
.spacer{flex:1}
.hud{display:flex;gap:16px;font-size:15px;color:var(--soft)}
.hud b{color:var(--ink);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.screen{display:none}.screen.on{display:block}
h1{font-size:30px;margin:4px 0 10px;line-height:1.2}
p{line-height:1.6}
.muted{color:var(--soft)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 18px;min-height:48px;font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px}
.mode strong{display:block;font-size:20px;margin-bottom:4px}
.mode span{color:var(--soft);font-size:15px;line-height:1.5}
.mode:hover{border-color:var(--accent)}
.opts{display:grid;gap:14px;margin-top:6px}
.opts label{font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sectionlabel{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}

.prompt{font-size:34px;font-weight:700;line-height:1.2;margin:6px 0 18px}
.timer{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin-bottom:18px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .2s linear}
.timer.low i{background:var(--bad)}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font-size:24px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);outline:none}
.answer input:focus{border-color:var(--accent)}
.mic{width:56px;flex:none;border:2px solid var(--line);background:var(--card);border-radius:14px;display:grid;place-items:center}
.mic.on{border-color:var(--bad);color:var(--bad)}
.mic svg{width:24px;height:24px}
.subrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;padding:6px 0;font-size:15px}
.heard{font-size:15px;color:var(--soft);min-height:22px;margin-top:8px}

.result{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.result .yours{font-size:28px;font-weight:700}
.result .note{font-size:15px;color:var(--soft);margin-top:4px}
.pts{display:flex;align-items:baseline;gap:10px;margin:12px 0 6px}
.pts .n{font-size:44px;font-weight:700;line-height:1}
.tag{font-size:14px;font-weight:500;border-radius:99px;padding:3px 10px;color:#fff}
.meter{height:10px;border-radius:99px;background:var(--bar);overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;border-radius:99px}
.others{font-size:15px;line-height:1.7}
.others b{font-weight:500}

table{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;font-weight:500;white-space:nowrap}
.big{font-size:48px;font-weight:700;line-height:1;margin:8px 0}
footer{margin-top:28px;font-size:14px;color:var(--soft);display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--soft)}
@media (max-width:560px){ .modes{grid-template-columns:1fr} .prompt{font-size:28px} h1{font-size:26px} .hud{gap:10px;font-size:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="brand" id="home">Dislexion</button>
    <div class="spacer"></div>
    <div class="hud" id="hud" hidden><span id="hudRound"></span><span>Score <b id="hudScore">0</b></span></div>
  </header>

  <!-- start -->
  <section class="screen on" id="sStart">
    <div class="card">
      <h1>Name something rare.</h1>
      <p class="muted">You get a category. Type or say an answer. The fewer people who'd think of it, the more points it's worth. Spelling doesn't have to be right — if it sounds close, it counts.</p>
      <div class="modes">
        <button class="mode" id="goDaily"><strong>Daily</strong><span id="dailyInfo">7 categories, same for everyone today.</span></button>
        <button class="mode" id="goEndless"><strong>Endless</strong><span>Categories keep coming until you stop.</span></button>
      </div>
      <div class="opts">
        <div>
          <div class="sectionlabel">Timer</div>
          <div class="chips" id="timerChips"></div>
        </div>
        <div>
          <div class="sectionlabel">Extra categories for Endless</div>
          <div class="chips" id="packChips"></div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px" id="statsCard"></div>
  </section>

  <!-- round -->
  <section class="screen" id="sRound">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span class="sectionlabel" id="roundLabel"></span>
        <button class="link" id="readPrompt">Read it to me</button>
      </div>
      <div class="prompt" id="prompt"></div>
      <div class="timer" id="timer"><i></i></div>
      <form class="answer" id="form" autocomplete="off">
        <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Your answer" aria-label="Your answer">
        <button type="button" class="mic" id="mic" aria-label="Say your answer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        </button>
      </form>
      <div class="heard" id="heard"></div>
      <div class="subrow" id="actRow">
        <button class="link" id="skip">Skip</button>
        <button class="btn primary" id="submit">Submit</button>
      </div>
      <div class="result" id="result" hidden></div>
    </div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="link" id="endRun" hidden>End run</button>
    </div>
  </section>

  <!-- summary -->
  <section class="screen" id="sDone">
    <div class="card" id="doneCard"></div>
  </section>

  <footer>
    <a href="writer.html">Writing helper</a>
    <button class="link" id="themeBtn" style="padding:0">Theme</button>
  </footer>
</div>

<script>
/* ===== Brilliant engine: spelling guesser + word prediction (no DOM) ===== */
const Engine = (() => {
  // ---- dyslexia-typical misspellings -> fix (always win) ----
  const MISS = {};
  (`because:becuz,becuse,becase,becouse,beacuse,becuase,becaus,becoz,becos,cuz,cauz,bc,bcuz,becauze|what:wat,wut,whut|when:wen,whn|where:wher,whare,were'|which:wich,whitch,wihch|would:woud,wuld,wud,wold|could:cud,coud,culd|should:shud,shoud,shuld|they:thay,tey|there:ther,thare|their:thier,theyr|said:sed,sayed|says:sez|enough:enuff,enuf,enugh,enogh,enouf,inuf|friend:freind,frend,frened|friends:frends,freinds|people:peple,poeple,pepole,pepul,peepul,peeple|tomorrow:tomoro,tomorow,tommorow,tommorrow,tomorro,tmrw,tmr|tonight:tonite,2nite|night:nite|through:thru,threw',thrugh|though:tho|tough:tuff|a lot:alot|definitely:definately,defenitly,definatly,defintely,definetly,defanetly|probably:probly,probaly,prolly,probabaly|really:realy,relly,rlly|actually:acually,actualy,akshully,acshully|business:bisness,buisness,busness,biznis|Wednesday:wensday,wednsday,wendsday|February:febuary,febuary|library:libary,liberry|again:agian,agen,agin|against:aginst,agenst|always:allways,alwas,allwas|answer:anser,awnser,ansur|before:befor,befour,befur|beginning:begining,beggining|believe:beleive,belive,beleve|breakfast:brekfast,breckfast|called:caled,cald|chief:cheif|chocolate:choclate,chocolat|coming:comming,cumming|different:diffrent,difrent,differnt,difernt|doesn't:dosent,doesnt,dosnt|don't:dont|didn't:didnt|can't:cant|won't:wont|isn't:isnt|wasn't:wasnt|I'm:im|I've:ive|you're:youre|that's:thats|what's:whats|it's:its'|any:eny|every:evry,evrey|everyone:evryone,everone,evrywun|everything:evrything,everthing,evrythin|family:famly,familiy,famaly|finally:finaly,finnaly|first:frist,ferst|government:goverment,govrment|guess:gess,ges|grammar:grammer|happened:happend,hapened|have:hav,hafe|house:hous,howse|interesting:intresting,intersting,intristing|interest:intrest,intrist|interests:intrests,intristes,intrestes,intrists|interested:intrested,intristed|just:jus,jst|knowledge:knowlege,nolege,nowlege|laugh:laff,lauf|learn:lern,lurn|listen:lisen,lissen,lisin|little:litle,littel|maybe:mabey,mayby,maybee,mabye|minute:minit|misspell:mispell,misspel|need:nead,neeed|necessary:neccesary,necesary,nessesary,nesesary|nothing:nothin,nuthing|occasion:ocasion,occassion|occurred:occured|often:ofen,offen|piece:peice|please:pleez,plez,pls,plz,pleas|possible:possable,posible|pretty:preety,prety,purty|receive:recieve,receve|right:rite|school:scool,skool,schol|separate:seperate,seprate|sure:shure,shur|something:sumthing,somthing,sumthin|someone:sumone,somone,sumwun|stories:storys|surprise:suprise,surprize|teacher:techer,teecher|thanks:thanx,thnks,thx|thought:thot,thougt|time:tyme|together:togather,togehter,togeather|tongue:tounge|trouble:trubble,truble|truly:truely,truley|until:untill,untile|usually:usally,usualy,ushually|wait:wayt|weird:wierd|while:wile|written:writen|writing:wrighting,writting,writeing|yesterday:yesturday,yestarday,yesterdy|your:yor,ur|you:u,yu|about:abowt,abut,abaut|anything:enything,anythin|certain:sertain,curtain'|schedule:skedule,schedual,shedule|another:anouther,anuther|brilliant:brillant,briliant,brilent|dyslexia:dyslexa,dislexia,dyslexsia,dislexya|speech:speach|whether:wether|recommend:reccomend,recomend,reccommend|address:adress|argument:arguement|calendar:calender|colleague:collegue|embarrass:embarass|environment:enviroment,envirnment|existence:existance|foreign:foriegn|forty:fourty|guard:gaurd|happiness:happyness|independent:independant|jewelry:jewelery|pursue:persue|possession:posession|publicly:publically|questionnaire:questionaire|referred:refered|rhythm:rythm,rythem|similar:similiar,simular|sincerely:sincerly,sinserely|successful:succesful,sucessful,successfull|achieve:acheive,acheeve|across:accross,acrost|beginner:begginer,beginer|battery:batery,battary,battry|batteries:batterys,bateries|solder:sodder,sauder,soder|processor:prosessor,procesor|computer:compueter,computor,compter|software:sofware,softwear|hardware:harware,hardwear|electronics:elecronics,electonics,elektronics|engineer:ingeneer,enginer,engeneer|investor:invester|investors:investers|beautiful:beutiful,butiful,beautifull,bueatiful|because of:becuzof|was:wuz,woz,wos|of:ov|the:teh,hte,th|and:adn,nad|that:taht,tht|with:wiht,whit'|have to:hafta|going to:gonna'|want to:wanna'|question:kwestion,qestion,questin|explain:eksplain,explane|square:skwer,sqare|phone:fone|elephant:elefant|dinosaur:dinosor,dinasaur|circle:sircle,cirkle|laughter:lafter|special:speshul,specal|picture:pikture,pitcher'|probably:prolly|whatever:watever,whatevr|favorite:favrite,faverite,favorit|animal:aminal|remember:rember,remeber|exactly:exacly,ezactly|especially:espesially,expecially,especialy`).split('|').forEach(row => {
    const [fix, list] = row.split(':');
    list.split(',').forEach(t => { if (!t.endsWith("'")) MISS[t] = fix; });
  });

  // ---- homophones / easily-mixed words, with plain-English hints ----
  const CONFUSE = {};
  (`there=a place;their=belongs to them;they're=they are|your=belongs to you;you're=you are|to=toward;too=also / very;two=the number 2|its=belongs to it;it's=it is|then=next, after that;than=comparing (bigger than)|where=what place;were=past of are;wear=put on clothes;we're=we are|no=opposite of yes;know=understand|new=not old;knew=past of know|right=correct / a side;write=put words down|hear=with your ears;here=this place|weather=rain, sun, snow;whether=if|form=a paper / a shape;from=where it started|quite=very;quiet=no noise|lose=not win / can't find;loose=not tight|affect=to change something;effect=the result|accept=say yes to;except=but not|buy=pay for;by=next to / made by;bye=goodbye|our=belongs to us;are=is (for many);hour=60 minutes|of=part of;off=not on|which=what one;witch=a magic person|whole=all of it;hole=a gap|peace=calm, no fighting;piece=a part of something|brake=to stop;break=smash / a rest|weak=not strong;week=7 days|meat=food;meet=get together|sea=the ocean;see=with your eyes|one=the number 1;won=past of win|for=for you;four=the number 4|threw=tossed;through=in one side, out the other|allowed=permitted;aloud=out loud|board=a flat piece / a group;bored=not interested|desert=sandy dry place;dessert=sweet food|passed=went by;past=time before now|principal=school boss / main;principle=a rule or belief|sell=give for money;cell=tiny unit / phone|plane=airplane;plain=simple|waist=middle of body;waste=throw away|tale=a story;tail=back end of an animal|mail=letters;male=a boy or man|sale=selling cheap;sail=on a boat|steal=take without asking;steel=strong metal|wait=stay;weight=how heavy|wood=from trees;would=might do|flour=for baking;flower=a plant|lead=to guide / a metal;led=past of lead / LED light|wright=a maker;right=correct`).split('|').forEach(g => {
    const items = g.split(';').map(x => { const [w, h] = x.split('='); return { w, h }; });
    items.forEach(it => { CONFUSE[it.w] = items; });
  });

  // ---- seed next-word pairs (prev:next,next) ----
  const SEED = {};
  function addPairs(str, bucket, weight) {
    str.split('|').forEach(row => {
      const [p, list] = row.split(':'); if (!list) return;
      const arr = bucket[p] || (bucket[p] = []);
      list.split(',').forEach((n, i) => arr.push({ w: n, v: weight - i * 0.06 }));
    });
  }
  addPairs(`i:am,think,was,have,will,just,can,don't,need,want,like,know,feel|you:can,are,have,know,need,want,should,could|it:is,was,will,would,to|this:is,was,week,one|that:is,was,i,you,the,we|i'm:not,going,so,a|we:can,are,need,have,will,should|to:the,be,make,get,do,go,see,a|the:best,same,first,other,next|thank:you|thanks:for,so|of:the,my,it,course|in:the,a,my,this,order|on:the,a,my,it|for:the,a,my,you,me|and:the,i,then,it|can:you,i,be,we|will:be,you,need|would:be,you,like,have|going:to|want:to|need:to,a,the|have:a,to,been,the,you|do:you,not,it|is:a,the,not,it,that|was:a,the,not,so|let:me,us|let's:go,do|how:are,to,do,much|what:is,are,do,i|please:let,send,see|see:you,the,if|looking:forward,for|forward:to|as:soon,well,a|soon:as|a:lot,few,good,little,great|lot:of|kind:of|sort:of|out:of|because:i,it,the|so:i,much,that,the|really:good,want,like|good:morning,luck,job|happy:birthday,to|hope:you,this|talk:to,about|know:if,what,that,how|sounds:good,great|make:sure,it|right:now|at:the,a,least|by:the|could:you,be|should:be,i|just:wanted,a,need`, SEED, 0.7);

  // ---- keyboard + confusion tables for the weighted edit distance ----
  const VOW = new Set('aeiouy');
  const ADJ = new Set();
  ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach((row, r, rows) => {
    for (let i = 0; i < row.length; i++) {
      const a = row[i];
      const near = [row[i - 1], row[i + 1]];
      if (rows[r + 1]) near.push(rows[r + 1][i - 1], rows[r + 1][i]);
      if (rows[r - 1]) near.push(rows[r - 1][i], rows[r - 1][i + 1]);
      near.forEach(b => { if (b) { ADJ.add(a + b); ADJ.add(b + a); } });
    }
  });
  const CONF = new Set();
  'bd pq bp dq mn mw nu ck cs kq fv gj sz iy ie ae ea ou uo ao ue ie'.split(' ').forEach(p => { CONF.add(p); CONF.add(p[1] + p[0]); });

  // numeric lookup tables (fast): chars -> 0..27
  const CI = ch => { const c = ch.charCodeAt(0); return c >= 97 && c <= 122 ? c - 97 : ch === "'" ? 26 : 27; };
  const AL = 28, SUB = new Float32Array(AL * AL), IND = new Float32Array(AL);
  for (let i = 0; i < AL; i++) {
    const x = i < 26 ? String.fromCharCode(97 + i) : i === 26 ? "'" : '#';
    IND[i] = x === "'" ? 0.1 : (x === 'h' || VOW.has(x)) ? 0.6 : 1;
    for (let j = 0; j < AL; j++) {
      const y = j < 26 ? String.fromCharCode(97 + j) : j === 26 ? "'" : '#';
      SUB[i * AL + j] = i === j ? 0 : CONF.has(x + y) ? 0.4 : (VOW.has(x) && VOW.has(y)) ? 0.5 : ADJ.has(x + y) ? 0.6 : 1;
    }
  }
  const codes = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = CI(s[i]); return a; };
  // cost of a missing/extra char c next to neighbour nb (doubled letters are cheap)
  const indel = (c, nb) => c === nb ? 0.3 : IND[c];

  // weighted Damerau-Levenshtein on code arrays: returns {full, pref} (pref = best cost vs a prefix of b)
  let R0 = new Float32Array(64), R1 = new Float32Array(64), R2 = new Float32Array(64);
  const RES = { full: 99, pref: 99 };
  function wdl(a, b, limit) {
    if (typeof a === 'string') a = codes(a);
    if (typeof b === 'string') b = codes(b);
    const m = a.length, n = b.length;
    const cols = n <= m + 3 ? n : m + 2;
    if (cols + 1 > R0.length) { R0 = new Float32Array(cols + 8); R1 = new Float32Array(cols + 8); R2 = new Float32Array(cols + 8); }
    let pp = R0, p = R1, c = R2;
    p[0] = 0;
    for (let j = 1; j <= cols; j++) p[j] = p[j - 1] + indel(b[j - 1], j > 1 ? b[j - 2] : 255);
    for (let i = 1; i <= m; i++) {
      const ai = a[i - 1], ap = i > 1 ? a[i - 2] : 255, row = ai * AL;
      c[0] = p[0] + indel(ai, ap);
      let rowMin = c[0];
      for (let j = 1; j <= cols; j++) {
        const bj = b[j - 1], bp = j > 1 ? b[j - 2] : 255;
        let v = p[j - 1] + SUB[row + bj];
        const d = p[j] + (ai === (i > 1 ? ap : bj) ? 0.3 : IND[ai]);
        if (d < v) v = d;
        const s = c[j - 1] + (bj === (j > 1 ? bp : ai) ? 0.3 : IND[bj]);
        if (s < v) v = s;
        if (ai === bp && ap === bj && i > 1 && j > 1) { const t = pp[j - 2] + 0.5; if (t < v) v = t; }
        c[j] = v;
        if (v < rowMin) rowMin = v;
      }
      if (rowMin > limit) { RES.full = 99; RES.pref = 99; return RES; }
      const tmp = pp; pp = p; p = c; c = tmp;
    }
    let pref = 99;
    for (let j = Math.max(1, m - 1), e = Math.min(cols, n - 1, m + 2); j <= e; j++) if (p[j] < pref) pref = p[j];
    RES.full = cols === n ? p[n] : 99; RES.pref = pref;
    return RES;
  }

  // dyslexia-tuned "sounds like" key
  function phon(w) {
    w = w.toLowerCase().replace(/[^a-z]/g, '');
    if (!w) return '';

  // ---- state ----
  let POOL = [];          // {k, t, f, ph, x, ns}
  let BASE = [];          // dictionary entries
  const RANK = new Map();
  const NOSUG = new Set();
  let extras = new Map(); // key -> {t, x}
  let extraNext = {};
  const ignore = new Set();
  let user = { count: {}, bi: {}, mem: {} };

  const key = s => s.toLowerCase().replace(/[^a-z0-9']/g, '');

  function init(wordStr, nosugStr) {
    const ws = wordStr.trim().split(/\s+/);
    (nosugStr || '').trim().split(/\s+/).forEach(w => w && NOSUG.add(w));
    const N = ws.length;
    BASE = ws.map((w, r) => {
      RANK.set(w, r);
      return { k: w, c: codes(w), t: w, f: 1 - Math.log(r + 2) / Math.log(N + 2), ph: phon(w), x: 0, ns: NOSUG.has(w) };
    });

  function setExtras(list, nextStr) { // list: [{t, x}]
    extras = new Map();
    list.forEach(e => { const k = key(e.t); if (k) extras.set(k, e); });
    extraNext = {}; if (nextStr) addPairs(nextStr, extraNext, 0.9);
    rebuild();
  }

  function rebuild() {
    POOL = BASE.map(e => {
      const x = extras.get(e.k);
      return x ? { ...e, t: x.t === x.t.toLowerCase() ? e.t : x.t, x: x.x } : e;
    });
    extras.forEach((e, k) => { if (!RANK.has(k)) POOL.push({ k, c: codes(k), t: e.t, f: 0.45, ph: phon(k), x: e.x, ns: false }); });
  }

  function setUser(u) { user = Object.assign({ count: {}, bi: {}, mem: {} }, u || {}); }
  function getUser() { return user; }

  function known(word) {
    const k = key(word);
    if (!k || ignore.has(k)) return true;
    if (MISS[k] && !extras.has(k)) return false;
    return RANK.has(k) || extras.has(k) || ignore.has(k) || !!user.count[k] && user.count[k] >= 2;
  }
  function flagged(word) {
    if (word.length < 2 || /\d/.test(word) || /_/.test(word)) return false;
    if (/^[A-Z]{2,6}s?$/.test(word)) return false; // acronyms like BOM, PCBs

  }

  function ctxBoost(prev, k) {

    let b = 0;
    const s = SEED[prev], e = extraNext[prev];
    if (s) for (const o of s) if (o.w === k) { b = Math.max(b, o.v); break; }
    if (e) for (const o of e) if (key(o.w) === k) { b = Math.max(b, o.v); break; }
    const c = user.bi[prev] && user.bi[prev][k];
    if (c) b += Math.min(0.9, 0.3 * Math.log2(1 + c));
    return b;

  function suggest(typed, prev, max = 6, typing = false) {

    if (!k) return [];

    const out = new Map();
    const put = (t, s, kind, cost) => {
      const kk = key(t), cur = out.get(kk);
      if (!cur || cur.s < s) out.set(kk, { t: display(t, typed), s, kind, cost });
    };

    if (MISS[k] && !extras.has(k)) put(MISS[k], 90, 'fix', 0);

        if (w.k[0] === k && i < 400 && !w.ns) put(w.t, w.f + ctxBoost(prev, w.k) + userBoost(w.k) + w.x, 'more', 0);

  function autofix(typed, prev) {

    if (!list.length) return null;
    const [a, b] = list;
    if (a.s >= 90) return a.t;
    if (k.length < 3) return null;
    if (a.cost <= Math.min(1.6, 0.4 * k.length) && (!b || a.s - b.s >= 0.45)) return a.t;

  function predict(prev, max = 5) {
    prev = key(prev || '');
    const score = new Map();
    const add = (w, v) => { const k = key(w); score.set(k, { t: w, s: (score.get(k)?.s || 0) + v }); };

    const k = key(word); if (!k || k.length > 30) return;

    const p = key(prev || '');

  function forget(typo) { delete user.mem[key(typo)]; }
  function addIgnore(w) { ignore.add(key(w)); }

  return { inDict: w => RANK.has(key(w)), init, setExtras, setUser, getUser, known, flagged, suggest, autofix, predict, confusables, learn, remember, forget, addIgnore, phon, wdl, key };
})();

drugada"],83],[["desayuno"],85],[["ornitorrinco"],86],[["almohada"],88],[["guay"],89],[["sobremesa"],90],[["estrenar"],92],[["ojala"],93],[["friolento"],94],[["chido"],96],[["consuegro"],97],[["tocayo"],99],[["aprovechar"],100]]}];
</script>
<script>
(() => {
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('dislexion.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dislexion.' + k, JSON.stringify(v)); } catch {} }
};
const S = Object.assign({ timer: 20, packs: [], theme: null }, store.get('settings', {}));
const saveS = () => store.set('settings', S);
const stats = Object.assign({ rounds: 0, points: 0, best: null, daily: {}, endlessBest: 0 }, store.get('stats', {}));
const saveStats = () => store.set('stats', stats);
const custom = store.get('custom', {}); // prompt -> [answers the player said were real]

const PACK_NAMES = { badge: 'Electronics & badges', print: '3D printing', code: 'Code', founder: 'Business', school: 'School' };

/* ---------- matching (forgiving spelling) ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim()
  .replace(/^(a|an|the|some) /, '');
const squash = s => s.replace(/[^a-z0-9]/g, '');
function singular(s) {
  if (s.length > 4 && s.endsWith('ies')) return s.slice(0, -3) + 'y';
  if (s.length > 4 && /(ch|sh|x|s|z|o)es$/.test(s)) return s.slice(0, -2);
  if (s.length > 3 && s.endsWith('s') && !s.endsWith('ss')) return s.slice(0, -1);
  return s;
}
function limitFor(n) { return n <= 3 ? 0.45 : n <= 5 ? 1.05 : n <= 8 ? 1.65 : 2.3; }
// returns {entry, cost, form} or null
function match(cat, raw) {
  const t = norm(raw); if (!t) return null;
  const tq = squash(t), ts = squash(singular(t));
  const tp = Engine.phon(tq);
  let best = null;
  const consider = (entry, form, cost) => { if (!best || cost < best.cost || (cost === best.cost && entry[1] > best.entry[1])) best = { entry, form, cost }; };
  const entries = cat.a.concat((custom[cat.q] || []).map(a => [[a], 30]));
  for (const entry of entries) {
    for (const f of entry[0]) {
      const fq = squash(norm(f));
      if (!fq) continue;
      if (fq === tq || fq === ts || squash(singular(norm(f))) === ts) { consider(entry, f, 0); continue; }
      const lim = limitFor(Math.max(fq.length, tq.length));
      if (Math.abs(fq.length - tq.length) > 3) continue;
      const c = Math.min(Engine.wdl(tq, fq, lim + 0.01).full, Engine.wdl(ts, fq, lim + 0.01).full);
      if (c <= lim) consider(entry, f, c);
      else if (fq.length >= 4 && Engine.phon(fq) === tp && Math.abs(fq.length - tq.length) <= 2) consider(entry, f, lim);
    }
    if (best && best.cost === 0) break;
  }
  return best;
}

/* ---------- rarity ---------- */
function rarity(p) {
  if (p >= 92) return ['Legendary', 'var(--r5)'];
  if (p >= 72) return ['Very rare', 'var(--r4)'];
  if (p >= 48) return ['Rare', 'var(--r3)'];
  if (p >= 25) return ['Uncommon', 'var(--r2)'];
  return ['Common', 'var(--r1)'];
}
const SMALL = new Set(['and', 'of', 'the', 'a', 'an', 'in', 'on', 'to', 'de', 'di', 'au', 'du']);
const title = s => s.split(' ').map((w, i) => i && SMALL.has(w) ? w : w.replace(/(^|-)([a-z])/g, (m, a, b) => a + b.toUpperCase())).join(' ');
const promptText = q => 'Name ' + q[0].toLowerCase() + q.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- daily seed ---------- */
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function rng(seed) { let h = 1779033703 ^ seed.length; for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
function shuffle(arr, r = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- game state ---------- */
let G = null; // {mode, deck, idx, total, log:[], cur, answered}
let timerId = null, endsAt = 0;

function startDaily() {
  const r = rng('dislexion-' + today());
  const deck = shuffle(CATS.filter(c => c.p === 'general'), r).slice(0, 7);
  G = { mode: 'daily', deck, idx: -1, total: 0, log: [] };
  next();
}
function startEndless() {
  G = { mode: 'endless', deck: [], idx: -1, total: 0, log: [] };
  next();
}
function endlessCard() {
  if (!G.deck.length || G.idx >= G.deck.length - 1) {
    const pool = CATS.filter(c => c.p === 'general' || S.packs.includes(c.p));
    let d = shuffle(pool);
    if (G.cur && d[0] === G.cur && d.length > 1) d.push(d.shift());
    G.deck = G.deck.slice(0, G.idx + 1).concat(d);
  }
}
function next() {
  if (G.mode === 'daily' && G.idx >= G.deck.length - 1) return finish();
  if (G.mode === 'endless') endlessCard();
  G.idx++; G.cur = G.deck[G.idx]; G.answered = false;
  show('sRound');
  $('hud').hidden = false;
  $('hudRound').textContent = G.mode === 'daily' ? `${G.idx + 1} of ${G.deck.length}` : `Round ${G.idx + 1}`;
  $('hudScore').textContent = G.total;
  $('roundLabel').textContent = G.mode === 'daily' ? 'Daily · ' + today() : 'Endless';
  $('endRun').hidden = G.mode !== 'endless';
  $('prompt').textContent = promptText(G.cur.q);
  $('inp').value = ''; $('inp').disabled = false; $('heard').textContent = '';
  $('result').hidden = true; $('result').innerHTML = '';
  $('actRow').hidden = false;
  $('inp').focus();
  startTimer();
}
function startTimer() {
  clearInterval(timerId);
  const bar = $('timer');
  if (!S.timer) { bar.hidden = true; return; }
  bar.hidden = false; bar.classList.remove('low');
  endsAt = Date.now() + S.timer * 1000;
  const tick = () => {
    const left = Math.max(0, endsAt - Date.now());
    bar.firstElementChild.style.transform = `scaleX(${left / (S.timer * 1000)})`;
    bar.classList.toggle('low', left < 5000);
    if (left <= 0) { clearInterval(timerId); answer($('inp').value, 'time'); }
  };
  tick(); timerId = setInterval(tick, 100);
}

function answer(raw, how) {
  if (G.answered) return;
  G.answered = true; clearInterval(timerId); stopMic();
  $('inp').disabled = true; $('actRow').hidden = true;
  const cat = G.cur;
  const m = raw && raw.trim() ? match(cat, raw) : null;
  const pts = m ? m.entry[1] : 0;
  G.total += pts;
  G.log.push({ q: cat.q, said: raw.trim(), ans: m ? m.entry[0][0] : null, pts });
  stats.rounds++; stats.points += pts;
  if (m && (!stats.best || pts > stats.best.pts)) stats.best = { q: cat.q, ans: m.entry[0][0], pts };
  saveStats();
  $('hudScore').textContent = G.total;
  renderResult(cat, raw.trim(), m, how);
}

function renderResult(cat, said, m, how) {
  const el = $('result'); el.hidden = false;
  const common = cat.a[0][0][0];
  const rare = cat.a.slice(-3).reverse().map(a => title(a[0][0]));
  let html = '';
  if (m) {
    const [label, color] = rarity(m.entry[1]);
    const fixed = norm(said) !== norm(m.form) && squash(norm(said)) !== squash(norm(m.form));
    html += `<div class="yours">${esc(title(m.entry[0][0]))}</div>`;
    if (fixed) html += `<div class="note">You wrote “${esc(said)}”. Close enough.</div>`;
    html += `<div class="pts"><span class="n">${m.entry[1]}</span><span class="tag" style="background:${color}">${label}</span></div>`;
    html += `<div class="meter"><i style="width:${m.entry[1]}%;background:${color}"></i></div>`;
  } else {
    const why = how === 'time' && !said ? 'Time ran out.' : how === 'skip' ? 'Skipped.' : `“${esc(said)}” isn't on the list.`;
    html += `<div class="yours">${why}</div>`;
    html += `<div class="pts"><span class="n">0</span></div>`;
    if (said && how !== 'skip') html += `<div class="row" style="margin:6px 0 14px"><button class="btn" id="countIt">It's real — count it</button></div>`;
  }
  html += `<div class="others">Most people say <b>${esc(title(common))}</b>. Rarest on the list: ${rare.map(r => `<b>${esc(r)}</b>`).join(', ')}.</div>`;
  html += `<div class="row" style="margin-top:18px"><button class="btn primary" id="nextBtn">${G.mode === 'daily' && G.idx >= G.deck.length - 1 ? 'See results' : 'Next'}</button><span class="muted" style="font-size:14px">or press Enter</span></div>`;
  el.innerHTML = html;
  $('nextBtn').onclick = next;
  $('nextBtn').focus();
  const ci = $('countIt');
  if (ci) ci.onclick = () => {
    (custom[cat.q] = custom[cat.q] || []).push(said.toLowerCase()); store.set('custom', custom);
    const last = G.log[G.log.length - 1]; last.ans = said; last.pts = 30; G.total += 30; stats.points += 30; saveStats();
    $('hudScore').textContent = G.total;
    renderResult(cat, said, { entry: [[said], 30], form: said, cost: 0 }, 'custom');
  };
}

function finish() {
  clearInterval(timerId); stopMic();
  const max = G.mode === 'daily' ? G.deck.length * 100 : (G.idx + 1) * 100;
  const rounds = G.log.length;
  if (G.mode === 'daily') { stats.daily[today()] = { total: G.total, log: G.log }; }
  else if (rounds) { const avg = Math.round(G.total / rounds); if (rounds >= 5 && avg > stats.endlessBest) stats.endlessBest = avg; }
  saveStats();
  const bars = G.log.map(l => ' ▁▂▃▄▅▆▇█'[Math.min(8, Math.ceil(l.pts / 12.5))] || ' ').join('');
  const share = G.mode === 'daily' ? `Dislexion ${today()}: ${G.total}/${max}\n${bars}` : `Dislexion Endless: ${G.total} points in ${rounds} rounds (avg ${rounds ? Math.round(G.total / rounds) : 0})\n${bars}`;
  let html = `<div class="sectionlabel">${G.mode === 'daily' ? 'Daily · ' + today() : 'Endless run'}</div>`;
  html += `<div class="big">${G.total}</div><div class="muted">${G.mode === 'daily' ? `out of ${max}` : `${rounds} rounds · average ${rounds ? Math.round(G.total / rounds) : 0}`}</div>`;
  html += '<table>' + G.log.map(l => `<tr><td>${esc(promptText(l.q))}<br><span class="muted">${l.ans ? esc(title(l.ans)) : (l.said ? '“' + esc(l.said) + '” — not counted' : 'no answer')}</span></td><td>${l.pts}</td></tr>`).join('') + '</table>';
  html += `<div class="row"><button class="btn primary" id="again">${G.mode === 'daily' ? 'Play Endless' : 'New run'}</button><button class="btn" id="copy">Copy result</button><button class="btn" id="menu">Menu</button></div>`;
  $('doneCard').innerHTML = html;
  show('sDone'); $('hud').hidden = true;
  $('again').onclick = startEndless;
  $('menu').onclick = home;
  $('copy').onclick = () => { navigator.clipboard?.writeText(share).then(() => { $('copy').textContent = 'Copied'; }, () => {}); };
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startMic() {
  if (!SR) { $('heard').textContent = 'Voice answers need Chrome, Edge or Safari.'; return; }
  if (G.answered) return;
  stopMic();
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.maxAlternatives = 6; rec.continuous = false;
  $('mic').classList.add('on'); $('heard').textContent = 'Listening…';
  rec.onresult = ev => {
    const r = ev.results[ev.results.length - 1];
    if (!r.isFinal) { $('heard').textContent = r[0].transcript; return; }
    let best = null, bestText = r[0].transcript;
    for (let i = 0; i < r.length; i++) {
      const t = r[i].transcript; const m = match(G.cur, t);
      if (m && (!best || m.cost < best.cost || (m.cost === best.cost && m.entry[1] > best.entry[1]))) { best = m; bestText = t; }
    }
    $('inp').value = bestText.trim();
    $('heard').textContent = 'Heard: ' + bestText.trim();
    answer(bestText, 'voice');
  };
  rec.onerror = ev => { $('heard').textContent = ev.error === 'not-allowed' ? 'Microphone is blocked. Allow it in the address bar.' : ev.error === 'no-speech' ? "Didn't catch that. Try again." : ''; };
  rec.onend = () => { $('mic').classList.remove('on'); rec = null; };
  try { rec.start(); } catch {}
}
function stopMic() { if (rec) { try { rec.abort(); } catch {} rec = null; } $('mic').classList.remove('on'); }

function speak(t) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 0.95; speechSynthesis.speak(u);
}

/* ---------- screens ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
function home() {
  clearInterval(timerId); stopMic();
  if (G && G.mode === 'endless' && G.log.length && document.getElementById('sRound').classList.contains('on')) { finish(); return; }
  G = null; $('hud').hidden = true; renderStart(); show('sStart');
}
function renderStart() {
  const t = $('timerChips'); t.innerHTML = '';
  [[20, '20 seconds'], [30, '30 seconds'], [45, '45 seconds'], [0, 'No timer']].forEach(([v, l]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = l; b.setAttribute('aria-pressed', S.timer === v);
    b.onclick = () => { S.timer = v; saveS(); renderStart(); }; t.appendChild(b);
  });
  const p = $('packChips'); p.innerHTML = '';
  Object.entries(PACK_NAMES).forEach(([k, l]) => {
    const n = CATS.filter(c => c.p === k).length;
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = `${l} (${n})`; b.setAttribute('aria-pressed', S.packs.includes(k));
    b.onclick = () => { S.packs = S.packs.includes(k) ? S.packs.filter(x => x !== k) : [...S.packs, k]; saveS(); renderStart(); }; p.appendChild(b);
  });
  const d = stats.daily[today()];
  $('dailyInfo').textContent = d ? `Done today: ${d.total} points. Play again for practice.` : '7 categories, same for everyone today.';
  const days = Object.keys(stats.daily).length;
  $('statsCard').innerHTML = stats.rounds
    ? `<div class="sectionlabel">Your stats</div><table>
        <tr><td>Answers given</td><td>${stats.rounds}</td></tr>
        <tr><td>Average points per answer</td><td>${Math.round(stats.points / stats.rounds)}</td></tr>
        <tr><td>Dailies played</td><td>${days}</td></tr>
        ${stats.endlessBest ? `<tr><td>Best Endless average (5+ rounds)</td><td>${stats.endlessBest}</td></tr>` : ''}
        ${stats.best ? `<tr><td>Best answer</td><td>${esc(title(stats.best.ans))} · ${stats.best.pts}</td></tr>` : ''}
      </table>`
    : `<div class="sectionlabel">How points work</div><p class="muted" style="margin:6px 0 0">Answers everyone thinks of (like “apple” for a fruit) are worth about 10. Answers almost nobody thinks of are worth up to 100.</p>`;
}

/* ---------- wiring ---------- */
$('goDaily').onclick = startDaily;
$('goEndless').onclick = startEndless;
$('home').onclick = home;
$('form').onsubmit = e => { e.preventDefault(); if ($('inp').value.trim()) answer($('inp').value, 'type'); };
$('submit').onclick = () => { if ($('inp').value.trim()) answer($('inp').value, 'type'); else $('inp').focus(); };
$('skip').onclick = () => answer('', 'skip');
$('mic').onclick = () => rec ? stopMic() : startMic();
$('readPrompt').onclick = () => speak(promptText(G.cur.q));
$('endRun').onclick = finish;
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && G && G.answered && $('sRound').classList.contains('on') && document.activeElement?.id !== 'countIt') { e.preventDefault(); next(); }
});
function applyTheme() { if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
$('themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; saveS(); applyTheme();
};
applyTheme(); renderStart();
})();
</script>
